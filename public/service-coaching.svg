<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="coachingPlaceholderTitle">
  <title id="coachingPlaceholderTitle">Placeholder image — replace with a photo</title>
  <defs>
    <linearGradient id="coachBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cb997e" />
      <stop offset="100%" stop-color="#ddbea9" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#coachBg)" />
  <polyline
