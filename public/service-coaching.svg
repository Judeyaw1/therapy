  <circle cx="620" cy="200" r="26" fill="#6b705c" opacity="0.85" />
  <circle cx="180" cy="420" r="16" fill="#a5a58d" opacity="0.85" />
  <text x="400" y="560" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#3a3a30" opacity="0.5">
    Replace with a photo
